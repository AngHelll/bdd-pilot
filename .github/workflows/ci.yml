name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run compile
      - run: npm run test:unit
      - run: npm run build
      - name: Package VSIX
        run: npx @vscode/vsce package --no-dependencies -o bdd-pilot.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: bdd-pilot-vsix
          path: bdd-pilot.vsix

  sample-smoke:
    # Pilot Stage-faithful: STAGE matches bddPilot.defaultStage — see README "CI parity with Pilot"
    runs-on: ubuntu-latest
    env:
      STAGE: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore sample BDD project
        run: dotnet restore samples/minimal-bdd/MinimalBdd.csproj
      - name: Build sample BDD project
        run: dotnet build samples/minimal-bdd/MinimalBdd.csproj --no-restore
      - name: Run all sample tests
        run: dotnet test samples/minimal-bdd/MinimalBdd.csproj --no-build --verbosity normal
      - name: Smoke tag filter (Category=smoke)
        run: dotnet test samples/minimal-bdd/MinimalBdd.csproj --no-build --filter "Category=smoke" --verbosity minimal
      - name: Smoke feature filter (FullyQualifiedName~SmokeFeature)
        run: dotnet test samples/minimal-bdd/MinimalBdd.csproj --no-build --filter "FullyQualifiedName~SmokeFeature" --verbosity minimal

  sample-smoke-xunit-v3:
    runs-on: ubuntu-latest
    env:
      STAGE: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore xUnit v3 sample
        run: dotnet restore samples/xunit-v3-bdd/XunitV3Bdd.csproj
      - name: Build xUnit v3 sample
        run: dotnet build samples/xunit-v3-bdd/XunitV3Bdd.csproj --no-restore
      - name: Run all xUnit v3 sample tests
        run: dotnet test samples/xunit-v3-bdd/XunitV3Bdd.csproj --no-build --verbosity normal
      - name: Smoke tag filter (Category=smoke)
        run: dotnet test samples/xunit-v3-bdd/XunitV3Bdd.csproj --no-build --filter "Category=smoke" --verbosity minimal
      - name: Smoke feature filter (FullyQualifiedName~SmokeFeature)
        run: dotnet test samples/xunit-v3-bdd/XunitV3Bdd.csproj --no-build --filter "FullyQualifiedName~SmokeFeature" --verbosity minimal
      - name: Outline row filter (one Examples row)
        run: dotnet test samples/xunit-v3-bdd/XunitV3Bdd.csproj --no-build --filter "DisplayName~first: %221%22, second: %222%22, result: %223%22" --verbosity minimal

  sample-smoke-mtp:
    runs-on: ubuntu-latest
    env:
      STAGE: test
    defaults:
      run:
        working-directory: samples/mtp-bdd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Restore MTP sample
        run: dotnet restore MtpBdd.csproj
      - name: Build MTP sample
        run: dotnet build MtpBdd.csproj --no-restore
      - name: Run all MTP sample tests
        run: dotnet test --no-build --results-directory TestResults --report-trx --report-trx-filename all.trx --output Detailed
      - name: All-tests TRX was written
        run: test -s TestResults/all.trx
      - name: Smoke tag (Category=smoke)
        run: dotnet test --no-build --filter-trait "Category=smoke" --results-directory TestResults --report-trx --report-trx-filename trait.trx
      - name: Smoke-tag TRX was written
        run: test -s TestResults/trait.trx
      - name: Outline row (one Examples row)
        run: dotnet test --no-build --filter-display-name '*first: "1", second: "2", result: "3"*' --results-directory TestResults --report-trx --report-trx-filename row.trx
      - name: Outline-row TRX was written
        run: test -s TestResults/row.trx
